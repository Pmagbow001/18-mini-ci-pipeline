<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>README Checker</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="page">
      <div class="card">
        <h1>GitHub README Checker</h1>
        <p class="subtitle">
          Check if your GitHub repository contains a README.md file.
        </p>

        <div class="input-row">
          <label class="sr-only" for="repo-url">GitHub Repository URL</label>
          <input
            type="text"
            id="repo-url"
            placeholder="Paste your GitHub repository URL"
          />
          <button id="check-button" type="button">Check Repository</button>
        </div>

        <p id="result" class="result" aria-live="polite"></p>
      </div>
    </main>

    <script src="/static/script.js" defer></script>
  </body>
</html>
